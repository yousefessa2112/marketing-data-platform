<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trends & Patterns Analysis</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .header {
      background: #1B2A4A;
      color: white;
      padding: 22px 34px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
    }
    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }
    .container {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .section {
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 12px;
      box-shadow: 0 3px 14px rgba(27, 42, 74, 0.08);
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: white;
      border: 1px solid #e7edf5;
      border-left: 5px solid #3B82F6;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.08);
    }
    .kpi-label {
      color: #6b7280;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .kpi-value {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 700;
      color: #1B2A4A;
    }
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .channel-card {
      border: 1px solid #e6ecf6;
      border-radius: 10px;
      padding: 14px;
      background: #fbfdff;
    }
    .channel-title {
      margin: 0 0 8px;
      color: #1B2A4A;
      font-size: 18px;
      font-weight: 700;
    }
    .channel-metrics {
      font-size: 14px;
      line-height: 1.7;
      color: #374151;
    }
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }
    .hub-card {
      background: white;
      border: 1px solid #e4ebf5;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(27, 42, 74, 0.08);
    }
    .hub-card h3 {
      margin: 0 0 8px;
      color: #1B2A4A;
    }
    .hub-card p {
      margin: 0 0 14px;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }
    .hub-card a {
      display: inline-block;
      text-decoration: none;
      background: #3B82F6;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
